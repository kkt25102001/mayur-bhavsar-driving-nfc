<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%" height="100%">
  <defs>
    <!-- Silver Chrome Metallic Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="40%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#E5A000"/>
    </linearGradient>

    <!-- Road Green Gradient -->
    <linearGradient id="roadGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Steering Wheel Metal Gradient -->
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFB800" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background: 100% Transparent (No Solid Black Rectangle) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- "Since 2012" Header Text -->
  <text x="250" y="46" text-anchor="middle" font-family="'Syne', 'Georgia', serif" font-size="20" font-weight="700" fill="#94A3B8" letter-spacing="2">Since 2012</text>

  <!-- ================= MONOGRAM GROUP ================= -->
  <g transform="translate(0, 10)">
    
    <!-- 'M' Yellow Base & Structure -->
    <path d="M 160 55 L 215 55 L 250 145 L 285 55 L 340 55 L 340 185 L 285 185 L 285 110 L 250 195 L 215 110 L 215 185 L 160 185 Z" fill="url(#goldGrad)" />

    <!-- 'M' Left Leg Checkered Pattern (Black / Yellow racing checks) -->
    <g transform="translate(145, 55)">
      <!-- Left column outline -->
      <rect x="0" y="0" width="30" height="130" fill="url(#goldGrad)" rx="2"/>
      
      <!-- Checkerboard pattern in lower half of left leg -->
      <rect x="0" y="65" width="15" height="13" fill="#090B0E"/>
      <rect x="15" y="65" width="15" height="13" fill="url(#goldGrad)"/>
      <rect x="0" y="78" width="15" height="13" fill="url(#goldGrad)"/>
      <rect x="15" y="78" width="15" height="13" fill="#090B0E"/>
      <rect x="0" y="91" width="15" height="13" fill="#090B0E"/>
      <rect x="15" y="91" width="15" height="13" fill="url(#goldGrad)"/>
      <rect x="0" y="104" width="15" height="13" fill="url(#goldGrad)"/>
      <rect x="15" y="104" width="15" height="13" fill="#090B0E"/>
      <rect x="0" y="117" width="15" height="13" fill="#090B0E"/>
      <rect x="15" y="117" width="15" height="13" fill="url(#goldGrad)"/>
    </g>

    <!-- 'B' Right Curve Base (Yellow Lower Loop & Structure) -->
    <path d="M 270 55 L 310 55 C 360 55 365 105 320 120 C 375 135 370 185 305 185 L 270 185 Z" fill="url(#goldGrad)"/>

    <!-- 'B' Curving Asphalt Road (Vibrant Green with White Dashes) -->
    <path d="M 270 55 L 305 55 C 350 55 360 100 325 125 C 290 150 260 160 260 185 L 240 185 C 240 145 280 135 305 115 C 330 95 320 75 295 75 L 270 75 Z" fill="url(#roadGreenGrad)"/>

    <!-- Road Dashed Center Divider Line -->
    <path d="M 275 65 L 295 65 C 315 65 325 85 305 105 C 285 125 250 145 250 185" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6,6" stroke-linecap="round"/>

    <!-- Car Icon on Green Roadway -->
    <g transform="translate(290, 78) scale(0.65)">
      <rect x="0" y="6" width="32" height="16" rx="4" fill="url(#goldGrad)"/>
      <path d="M 6 6 L 10 0 L 22 0 L 26 6 Z" fill="url(#goldGrad)"/>
      <circle cx="6" cy="18" r="4" fill="#090B0E" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="26" cy="18" r="4" fill="#090B0E" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="9" y="3" width="14" height="4" rx="1" fill="#090B0E"/>
      <circle cx="4" cy="10" r="2" fill="#FFFFFF"/>
      <circle cx="28" cy="10" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Center Steering Wheel in 'M' (Silver Chrome Finish) -->
    <g transform="translate(210, 130)">
      <!-- Outer Wheel Rim -->
      <circle cx="20" cy="20" r="28" fill="none" stroke="url(#wheelGrad)" stroke-width="7" filter="url(#logoGlow)"/>
      <circle cx="20" cy="20" r="24" fill="#090B0E"/>
      <!-- Inner Boss -->
      <circle cx="20" cy="20" r="10" fill="url(#wheelGrad)"/>
      <!-- Steering Spokes (3-Spoke) -->
      <line x1="20" y1="20" x2="20" y2="46" stroke="url(#wheelGrad)" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="20" x2="-4" y2="12" stroke="url(#wheelGrad)" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="20" x2="44" y2="12" stroke="url(#wheelGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Horn Bugle Icon -->
      <path d="M 18 18 L 22 17 L 22 23 L 18 22 Z M 22 19 L 24 18 L 24 22 L 22 21 Z" fill="#090B0E"/>
    </g>
  </g>

  <!-- ================= BRAND NAME & DESIGNATION ================= -->
  <!-- "MAYUR BHAVSR" (Embossed Silver Chrome Font) -->
  <text x="250" y="275" text-anchor="middle" font-family="'Syne', 'Cinzel', serif" font-size="34" font-weight="900" fill="url(#silverGrad)" letter-spacing="4" filter="url(#logoGlow)">MAYUR BHAVSR</text>

  <!-- "Car Driving Professional Trainer" (Bright Golden Yellow) -->
  <text x="250" y="315" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="url(#goldGrad)" letter-spacing="1.5">Car Driving Professional Trainer</text>
</svg>
